id: secret-scan
name: Secret Scan
description: >
  Detects hardcoded credentials (AWS access keys, PEM private keys,
  GitHub/Slack tokens, generic secret-looking assignments) in any file
  packaged with the skill.
category: SECRET
level: 1
mandatory: true
default_enabled: true
severity: BLOCK
standard_ref: "gitleaks/trufflehog detector patterns; CWE-798 Use of Hard-coded Credentials"
kind: regex_file_scan
config:
  scope: all_files
  patterns:
    - name: aws_access_key
      regex: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    - name: pem_private_key
      regex: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |ENCRYPTED )?PRIVATE KEY-----'
    - name: github_token
      regex: '\bgh[pousr]_[A-Za-z0-9]{36}\b'
    - name: slack_token
      regex: '\bxox[baprs]-[0-9A-Za-z-]{10,72}\b'
    - name: generic_secret_assignment
      regex: '(?i)\b(?:api[_-]?key|api[_-]?secret|secret[_-]?key|access[_-]?token|client[_-]?secret|private[_-]?key|password)\b\s*[:=]\s*["'']?[A-Za-z0-9/_\-+]{12,}["'']?'
