name: Build on PR approval

# Separate from ci.yml's push/PR-triggered lint+test: this fires only once a
# PR review is submitted, building the service's Docker image (the actual
# deployable artifact) without pushing it anywhere — just verifying the
# Dockerfile still builds cleanly on the reviewed commit.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  build:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      # pull_request_review does not check out the PR head by default (it
      # resolves to the base branch) — pin explicitly to the reviewed commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: jaas-guardrails:pr-${{ github.event.pull_request.number }}
